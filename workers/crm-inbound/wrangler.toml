# Cloudflare Email Worker for the CRM's inbound mail (see README.md).
# No secrets here: INBOUND_SECRET is set with `wrangler secret put INBOUND_SECRET`.

name = "bananasplit-crm-inbound"
main = "src/index.js"
compatibility_date = "2026-06-01"

[vars]
# Your app's inbound endpoint. Replace the host with your deployment's.
INBOUND_URL = "https://your-app.example.com/api/crm/inbound"
# The name Cloudflare signs its Authentication-Results with. Only results
# under this name are trusted when checking who really sent a message.
AUTHSERV_ID = "mx.cloudflare.net"
