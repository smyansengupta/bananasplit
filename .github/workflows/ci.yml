name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, and test
    runs-on: ubuntu-latest
    env:
      # Prisma's config loader requires this to resolve even for schema-only
      # commands (generate, validate) — no live connection is made for those.
      DATABASE_URL: "postgresql://user:password@localhost:5432/cbc_portal"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Unit tests
        run: pnpm test
